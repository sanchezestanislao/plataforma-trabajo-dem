<!--DEMO-->
<section class="reloj" aria-label="Reloj de la demo">
  <span class="reloj-cuando"><span class="reloj-titulo">Reloj de la demo</span><span class="reloj-fecha" id="reloj-fecha"></span></span>
  <label class="oculto" for="reloj-hora">Hora simulada</label>
  <input type="time" id="reloj-hora">
  <button class="btn-r" type="button" data-a="mas" data-min="15" id="reloj-15">Sumar 15 min</button>
  <button class="btn-r" type="button" data-a="mas" data-min="60" id="reloj-60">Sumar 1 h</button>
  <button class="btn-r empuja" type="button" data-a="dia" id="reloj-dia">Pasar al día siguiente</button>
  <button class="btn-r" type="button" data-a="reiniciar" id="reloj-reiniciar">Reiniciar demo</button>
</section>
<!--/DEMO-->
